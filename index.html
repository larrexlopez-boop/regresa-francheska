<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NO HAGAS HUEVADAS 🖕</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* =========================
           FONDO
        ========================= */

        .fondo {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, #30005c 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, #002b5c 0%, transparent 25%),
                #000;
            z-index: -3;
        }

        /* Luces */
        .luz {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: moverLuz 8s infinite alternate ease-in-out;
        }

        .luz1 {
            background: #8a00ff;
            top: -150px;
            left: -100px;
        }

        .luz2 {
            background: #0066ff;
            bottom: -150px;
            right: -100px;
            animation-delay: 2s;
        }

        .luz3 {
            background: #ff006a;
            top: 40%;
            left: 45%;
            width: 200px;
            height: 200px;
            animation-delay: 4s;
        }

        @keyframes moverLuz {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(100px, -50px) scale(1.2);
            }

            100% {
                transform: translate(-80px, 100px) scale(0.9);
            }
        }

        /* =========================
           PARTÍCULAS
        ========================= */

        .particulas {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        .particula {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
            animation: subir linear infinite;
        }

        .particula:nth-child(1) {
            left: 10%;
            animation-duration: 7s;
            animation-delay: 1s;
        }

        .particula:nth-child(2) {
            left: 20%;
            animation-duration: 10s;
        }

        .particula:nth-child(3) {
            left: 35%;
            animation-duration: 8s;
            animation-delay: 2s;
        }

        .particula:nth-child(4) {
            left: 50%;
            animation-duration: 12s;
        }

        .particula:nth-child(5) {
            left: 65%;
            animation-duration: 9s;
            animation-delay: 3s;
        }

        .particula:nth-child(6) {
            left: 80%;
            animation-duration: 11s;
        }

        .particula:nth-child(7) {
            left: 90%;
            animation-duration: 7s;
            animation-delay: 2s;
        }

        @keyframes subir {
            0% {
                bottom: -20px;
                opacity: 0;
                transform: translateX(0);
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                bottom: 110%;
                opacity: 0;
                transform: translateX(80px);
            }
        }

        /* =========================
           CONTENIDO
        ========================= */

        .contenedor {
            text-align: center;
            padding: 60px;
            position: relative;
        }

        .contenedor::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            box-shadow:
                0 0 30px rgba(140, 0, 255, 0.3),
                inset 0 0 30px rgba(0, 100, 255, 0.1);

            animation: borde 3s infinite alternate;
        }

        @keyframes borde {
            from {
                box-shadow:
                    0 0 20px rgba(140, 0, 255, 0.2),
                    inset 0 0 20px rgba(0, 100, 255, 0.1);
            }

            to {
                box-shadow:
                    0 0 50px rgba(0, 140, 255, 0.5),
                    inset 0 0 40px rgba(150, 0, 255, 0.2);
            }
        }

        /* =========================
           TEXTO
        ========================= */

        h1 {
            font-size: clamp(45px, 8vw, 100px);
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;

            color: white;

            text-shadow:
                0 0 5px white,
                0 0 15px #8a00ff,
                0 0 30px #8a00ff,
                0 0 60px #0066ff;

            animation:
                aparecer 1.5s ease-out,
                brillo 2s infinite alternate;
        }

        @keyframes aparecer {
            0% {
                opacity: 0;
                transform: scale(0.5);
                filter: blur(20px);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes brillo {
            from {
                text-shadow:
                    0 0 5px white,
                    0 0 15px #8a00ff,
                    0 0 30px #8a00ff;
            }

            to {
                text-shadow:
                    0 0 10px white,
                    0 0 30px #0066ff,
                    0 0 60px #0066ff,
                    0 0 100px #8a00ff;
            }
        }

        p {
            margin-top: 25px;
            font-size: 20px;
            color: #aaa;
            letter-spacing: 3px;

            animation: aparecerTexto 2s ease-out;
        }

        @keyframes aparecerTexto {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           LÍNEA DECORATIVA
        ========================= */

        .linea {
            width: 250px;
            height: 3px;
            margin: 30px auto 0;

            background: linear-gradient(
                90deg,
                transparent,
                #8a00ff,
                #00aaff,
                #8a00ff,
                transparent
            );

            box-shadow:
                0 0 10px #8a00ff,
                0 0 20px #0066ff;

            animation: linea 2s infinite alternate;
        }

        @keyframes linea {
            from {
                transform: scaleX(0.5);
                opacity: 0.5;
            }

            to {
                transform: scaleX(1.2);
                opacity: 1;
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .contenedor {
                padding: 35px 20px;
                margin: 20px;
            }

            h1 {
                letter-spacing: 3px;
            }

            p {
                font-size: 14px;
            }

            .linea {
                width: 150px;
            }
        }
    </style>
</head>

<body>

    <!-- Fondo -->
    <div class="fondo"></div>

    <!-- Luces -->
    <div class="luz luz1"></div>
    <div class="luz luz2"></div>
    <div class="luz luz3"></div>

    <!-- Partículas -->
    <div class="particulas">
        <div class="particula"></div>
        <div class="particula"></div>
        <div class="particula"></div>
        <div class="particula"></div>
        <div class="particula"></div>
        <div class="particula"></div>
        <div class="particula"></div>
    </div>

    <!-- Contenido -->
    <div class="contenedor">

        <h1>NO HAGAS HUEVADAS 🖕</h1>

        <div class="linea"></div>

        <p> Vamo a tomar </p>

    </div>

</body>
</html>
